<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackcurity 2026 — Hack the Future of Security</title>
  <meta name="description" content="Hackcurity 2026 is the premier cybersecurity hackathon. 48 hours. $25,000 in prizes. Join 500+ hackers building the future of security." />

  <!-- Google Fonts: maximalist stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:  ['Space Grotesk','ui-sans-serif','system-ui','sans-serif'],
            display:['Black Ops One','cursive'],
            bebas: ['Bebas Neue','cursive'],
            mono:  ['Space Mono','monospace'],
          }
        }
      }
    };
  </script>

  <style>
    /* ── CSS Tokens ── */
    :root {
      --acid:   #BFFF00;
      --magenta:#FF2D78;
      --cyan:   #00F0FF;
      --orange: #FF6B00;
      --purple: #9B00FF;
      --yellow: #FFE000;
      --bg:     #0A0005;
      --surface:#100010;
      --text:   #F5F0FF;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; }

    /* ── Selection ── */
    ::selection { background: var(--magenta); color: #fff; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0A0005; }
    ::-webkit-scrollbar-thumb { background: var(--magenta); border-radius: 3px; }

    /* ── Custom cursor (desktop only) ── */
    @media (hover: hover) and (pointer: fine) {
      *, *::before, *::after { cursor: none !important; box-sizing: border-box; }
      #cx-dot {
        position: fixed; z-index: 9999; pointer-events: none;
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--acid);
        transform: translate(-50%,-50%);
        transition: width .15s, height .15s;
        will-change: left, top;
        mix-blend-mode: difference;
      }
      #cx-ring {
        position: fixed; z-index: 9998; pointer-events: none;
        width: 40px; height: 40px; border-radius: 50%;
        border: 2px solid var(--magenta);
        transform: translate(-50%,-50%);
        transition: width .3s cubic-bezier(.34,1.56,.64,1),
                    height .3s cubic-bezier(.34,1.56,.64,1),
                    border-color .2s;
        will-change: left, top;
      }
      body.cx-hover #cx-ring { width:58px; height:58px; border-color:var(--cyan); }
      body.cx-click #cx-dot  { width:16px; height:16px; }
      body.cx-click #cx-ring { width:30px; height:30px; }
    }
    /* Hide cursor elements on touch / mobile */
    @media (hover: none), (pointer: coarse) {
      #cx-dot, #cx-ring, #mx-glow { display: none !important; }
      *, *::before, *::after { cursor: auto; box-sizing: border-box; }
    }
    /* Always set box-sizing on non-cursor fallback */
    *, *::before, *::after { box-sizing: border-box; }

    /* ── Mouse glow ── */
    #mx-glow {
      position: fixed; z-index: 0; pointer-events: none;
      width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle, rgba(191,255,0,.07) 0%, rgba(155,0,255,.05) 40%, transparent 70%);
      transform: translate(-50%,-50%);
      will-change: left, top;
    }

    /* ── Particle trail ── */
    .mx-p {
      position: fixed; pointer-events: none; border-radius: 50%; z-index: 9996;
      transform: translate(-50%,-50%);
      animation: mx-fade .9s ease forwards;
    }
    @keyframes mx-fade { 0%{opacity:.7;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-50%) scale(0)} }

    /* ── Tilt ── */
    .tilt { transform-style: preserve-3d; }

    /* ── Blink ── */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .animate-blink { animation: blink 1s step-end infinite; }

    /* ── Pulse ── */
    @keyframes pulse { 0%,100%{opacity:.7;transform:scale(1)} 50%{opacity:1;transform:scale(1.22)} }

    /* ── ScaleIn ── */
    @keyframes scaleIn { from{opacity:0;transform:scale(0.4)} to{opacity:1;transform:scale(1)} }

    /* ── Marquee ── */
    @keyframes marquee { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    .marquee-track { animation: marquee 18s linear infinite; }

    /* ── Noise texture overlay ── */
    body::before {
      content:'';
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
    }

    /* ── Grid pattern overlay ── */
    .grid-overlay {
      background-image:
        linear-gradient(rgba(191,255,0,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(191,255,0,.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ── Diagonal stripe ── */
    .stripe-bg {
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 8px,
        rgba(255,45,120,.06) 8px,
        rgba(255,45,120,.06) 10px
      );
    }

    /* ── Dot matrix ── */
    .dot-matrix {
      background-image: radial-gradient(circle, rgba(191,255,0,.18) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    /* ── Section divider ── */
    .sec-divider {
      height: 4px;
      background: linear-gradient(90deg, var(--magenta), var(--purple), var(--cyan), var(--acid));
    }

    /* ── Glitch text ── */
    @keyframes glitch1 {
      0%,100%{clip-path:inset(0 0 95% 0);transform:translateX(-2px)}
      50%{clip-path:inset(35% 0 55% 0);transform:translateX(2px)}
    }
    @keyframes glitch2 {
      0%,100%{clip-path:inset(70% 0 15% 0);transform:translateX(2px)}
      50%{clip-path:inset(10% 0 80% 0);transform:translateX(-2px)}
    }
    .glitch { position:relative; display:inline-block; }
    .glitch::before,.glitch::after {
      content:attr(data-text); position:absolute; inset:0;
      color:inherit;
    }
    .glitch::before { color:var(--magenta); animation:glitch1 3s infinite steps(1); }
    .glitch::after  { color:var(--cyan);    animation:glitch2 3s infinite steps(1) .15s; }

    /* ── Float animation ── */
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

    /* ── Spin slow ── */
    @keyframes spin-slow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .spin-slow { animation: spin-slow 20s linear infinite; }

    /* ── Neon glow text ── */
    .neon-acid  { text-shadow: 0 0 10px var(--acid),  0 0 30px var(--acid),  0 0 60px rgba(191,255,0,.4); }
    .neon-mag   { text-shadow: 0 0 10px var(--magenta),0 0 30px var(--magenta),0 0 60px rgba(255,45,120,.4); }
    .neon-cyan  { text-shadow: 0 0 10px var(--cyan),  0 0 30px var(--cyan),  0 0 60px rgba(0,240,255,.4); }

    /* ── Border glow ── */
    .border-neon-acid { border-color: var(--acid); box-shadow: 0 0 12px rgba(191,255,0,.35), inset 0 0 6px rgba(191,255,0,.1); }
    .border-neon-mag  { border-color: var(--magenta); box-shadow: 0 0 12px rgba(255,45,120,.35), inset 0 0 6px rgba(255,45,120,.1); }
    .border-neon-cyan { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,240,255,.35), inset 0 0 6px rgba(0,240,255,.1); }

    /* ── Card hover ── */
    .max-card {
      transition: transform .2s ease, box-shadow .2s ease;
    }
    @media (hover: hover) {
      .max-card:hover { transform: translateY(-4px) scale(1.01); }
    }

    /* ═══════════════════════════════════
       MOBILE RESPONSIVE OVERRIDES
    ═══════════════════════════════════ */

    /* Fluid grid auto-fit clamp helpers */
    .grid-auto-sm  { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 16px; }
    .grid-auto-md  { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 16px; }
    .grid-auto-lg  { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 20px; }
    .grid-auto-xl  { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 20px; }

    /* Two-column CTA/contact grid */
    .cta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 48px; }

    /* Stats 4-col → 2-col on xs */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 28px; }

    /* Step members grid */
    .step2-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }

    /* Modal: full-width on very small screens */
    @media (max-width: 520px) {
      .modal-step-grid { grid-template-columns: 1fr !important; }
      .modal-level-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .modal-summary-grid { grid-template-columns: 1fr !important; }
    }

    /* Marquee: respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .marquee-track { animation: none; }
    }

    /* Prevent horizontal scroll caused by huge decorative text */
    .deco-bg-text { 
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

<!-- Cursor & glow layers -->
<div id="cx-dot"></div>
<div id="cx-ring"></div>
<div id="mx-glow"></div>
<div id="root"></div>

<!-- React 18 + ReactDOM -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Babel Standalone (JSX) -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- ── Mouse effects: desktop only (hover-capable pointer) ── -->
<script>
(function() {
  // Only activate the custom cursor on true pointer devices (mouse / trackpad)
  var isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches;
  var dot  = document.getElementById('cx-dot');
  var ring = document.getElementById('cx-ring');
  var glow = document.getElementById('mx-glow');

  if (isTouch || !dot || !ring) {
    // Ensure cursor elements are invisible on touch devices
    if (dot)  dot.style.display  = 'none';
    if (ring) ring.style.display = 'none';
    if (glow) glow.style.display = 'none';
    return;
  }

  var rx = -200, ry = -200, mx = -200, my = -200;
  var colors = ['#BFFF00','#FF2D78','#00F0FF','#FF6B00','#9B00FF','#FFE000'];

  window.addEventListener('mousemove', function(e) {
    mx = e.clientX; my = e.clientY;
    dot.style.left  = mx + 'px'; dot.style.top  = my + 'px';
    if (glow) { glow.style.left = mx + 'px'; glow.style.top = my + 'px'; }
    // Particle trail
    if (Math.random() > 0.55) {
      var p = document.createElement('div');
      var s = 4 + Math.random() * 7;
      var c = colors[Math.floor(Math.random() * colors.length)];
      p.className = 'mx-p';
      p.style.cssText = 'width:'+s+'px;height:'+s+'px;left:'+mx+'px;top:'+my+'px;background:'+c+';opacity:'+(0.4+Math.random()*0.5);
      document.body.appendChild(p);
      setTimeout(function(){ if (p.parentNode) p.remove(); }, 950);
    }
  });

  // Ring lerp (rAF) — smooth lagging ring
  (function lerp() {
    rx += (mx - rx) * 0.1;
    ry += (my - ry) * 0.1;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(lerp);
  })();

  // Hover / click state classes for ring expansion
  document.addEventListener('mouseover', function(e) {
    var el = e.target;
    while (el) {
      if (el.tagName === 'A' || el.tagName === 'BUTTON' ||
          (el.className && typeof el.className === 'string' &&
           (el.className.indexOf('tilt') >= 0 || el.className.indexOf('mag') >= 0))) {
        document.body.classList.add('cx-hover'); return;
      }
      el = el.parentElement;
    }
    document.body.classList.remove('cx-hover');
  });
  document.addEventListener('mousedown', function() { document.body.classList.add('cx-click'); });
  document.addEventListener('mouseup',   function() { document.body.classList.remove('cx-click'); });
})();
</script>

<!-- ── React Application ── -->
<script>
  if (window.Babel) {
    Babel.registerPreset('custom-react', {
      presets: [
        [Babel.availablePresets['react'], { runtime: 'classic' }]
      ]
    });
  }
</script>
<script type="text/babel" data-presets="custom-react" src="app.js"></script>
</body>
</html>
